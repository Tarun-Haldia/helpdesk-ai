services:

  - name: helpdesk-ai-api
    type: web
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: python api/start.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CONFIDENCE_THRESHOLD
        value: "60"
      - key: PYTHON_VERSION
        value: "3.11.3"

  - name: helpdesk-ai-app
    type: web
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.3"